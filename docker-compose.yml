services:
  db:
    image: postgres:16
    container_name: eve-db
    environment:
      POSTGRES_DB: eve
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eve-api
    environment:
      DATABASE_URL: postgresql+psycopg://eve:eve@db:5432/eve
      SECRET_KEY: change-this-secret
      TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  